[project]
name = "weir-sdk"
version = "0.1.0"
description = "Weir SDK: count items through async pipelines to find lost, stuck and slow ones"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.urls]
Homepage = "https://weirhq.com"
Repository = "https://github.com/weir-hq/weir"
Issues = "https://github.com/weir-hq/weir/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weir"]

[tool.ruff]
line-length = 120
