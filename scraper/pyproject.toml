[project]
name = "weir-scraper"
version = "0.1.0"
description = "Weir scraper: reports items waiting between stages (Kafka topics, staging tables), with no code changes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["weir-sdk", "confluent-kafka>=2.6", "psycopg[binary]>=3.2"]

[project.scripts]
weir-scraper = "weir_scraper.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
weir-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weir_scraper"]
