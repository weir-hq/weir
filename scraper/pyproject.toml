[project]
name = "weir-scraper"
version = "0.1.0"
description = "Weir scraper: items waiting between pipeline stages, in queues and staging tables"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["weir-sdk", "confluent-kafka>=2.6", "psycopg[binary]>=3.2"]

[project.urls]
Homepage = "https://weirhq.com"
Repository = "https://github.com/weir-hq/weir"
Issues = "https://github.com/weir-hq/weir/issues"

[project.scripts]
weir-scraper = "weir_scraper.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
weir-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weir_scraper"]
