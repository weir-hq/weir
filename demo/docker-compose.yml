name: weir-demo

# Shared settings for the pipeline services. Every service gets the same fault
# env file; each one only reads the variables it cares about.
x-app: &app
  build:
    context: ..
    dockerfile: demo/Dockerfile
  restart: on-failure
  env_file:
    - ${FAULT_ENV:-faults/none.env}
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
    PG_DSN: postgresql://weir:weir@postgres:5432/weir
    REDIS_URL: redis://redis:6379/0
    WEIR_ENDPOINT: http://weir-server:4100
  depends_on:
    weir-server:
      condition: service_started
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    init-topics:
      condition: service_completed_successfully

services:
  weir-server:
    build: ../server
    ports:
      - "4100:4100"

  kafka:
    image: apache/kafka:3.8.0
    environment:
      # JDK 21 crashes with SIGILL on recent Apple Silicon unless SVE is disabled.
      JAVA_TOOL_OPTIONS: &jvm_opts "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  init-topics:
    image: apache/kafka:3.8.0
    environment:
      JAVA_TOOL_OPTIONS: *jvm_opts
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in orders lines; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done
    restart: "no"

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weir
      POSTGRES_PASSWORD: weir
      POSTGRES_DB: weir
    ports:
      - "55432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql:/sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "weir", "-d", "weir"]
      interval: 5s
      retries: 10

  producer:
    <<: *app
    command: ["python", "producer.py"]

  enrich:
    <<: *app
    command: ["python", "enrich.py"]

  batcher:
    <<: *app
    command: ["python", "batcher.py"]

  worker:
    <<: *app
    command: ["celery", "-A", "tasks", "worker", "--loglevel=INFO", "--concurrency=2"]

  aggregate:
    <<: *app
    command: ["python", "aggregate.py"]

  # Watches the edges between stages (Kafka topics, the staging table) from the outside: no code
  # in the services. See demo/scraper.toml and scraper/.
  scraper:
    <<: *app
    build:
      context: ..
      dockerfile: demo/Dockerfile
      args:
        PACKAGE: weir-scraper
    environment:
      OTEL_SERVICE_NAME: weir-scraper
      WEIR_ENDPOINT: http://weir-server:4100
    volumes:
      - ./scraper.toml:/etc/weir/scraper.toml:ro
    command: ["weir-scraper", "/etc/weir/scraper.toml"]

  # SDK overhead benchmark, run with `make bench`. Not part of the pipeline.
  bench:
    <<: *app
    profiles: [bench]
    restart: "no"
    volumes:
      - ./bench:/bench:ro
    command: ["python", "/bench/kafka_bench.py"]

volumes:
  pgdata:
