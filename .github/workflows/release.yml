# On a version tag (v0.1.0): the server image and the Helm chart, both on GHCR.
#   ghcr.io/weir-hq/weir-server:<version>
#   oci://ghcr.io/weir-hq/charts/weir --version <version>
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  server:
    name: Server image and Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image (amd64, arm64)
        uses: docker/build-push-action@v7.4.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/weir-hq/weir-server:${{ steps.version.outputs.version }}
            ghcr.io/weir-hq/weir-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/weir-hq/weir
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - uses: azure/setup-helm@v5.1.0
      - name: Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/weir --version "$VERSION" --app-version "$VERSION"
          helm push "weir-$VERSION.tgz" oci://ghcr.io/weir-hq/charts
