<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Weir">
  <!-- A V-notch weir: the plate hydrologists put across a stream to measure its flow.
       The water level in the notch gives the flow rate; the two halves of the plate read as a W. -->
