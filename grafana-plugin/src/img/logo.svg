  <path d="M10 17h9l13 20 13-20h9v24H10z" fill="#ffffff"/>
  <path d="M23.5 23.5h17L32 37z" fill="#9fe7e3"/>
  <path d="M11 51c3.5-2.6 6.5-2.6 10.5 0s7 2.6 10.5 0 7-2.6 10.5 0 6.5 2.6 10.5 0" fill="none" stroke="#9fe7e3" stroke-width="3.6" stroke-linecap="round"/>
</svg>
